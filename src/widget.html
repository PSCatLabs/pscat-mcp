<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSCat render</title>
<style>
:root { color-scheme: light dark; --fg: #1a1a1a; --muted: #5c5c5c; --bg: #ffffff; --line: #d6d6d6; }
@media (prefers-color-scheme: dark) {
  :root { --fg: #ececec; --muted: #a6a6a6; --bg: #1f1f1f; --line: #3d3d3d; }
}
body { margin: 0; padding: 12px; background: var(--bg); color: var(--fg);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
figure { margin: 0 0 14px; }
img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); }
.link { margin: 4px 0 0; font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace;
  color: var(--muted); word-break: break-all; }
.note { margin: 4px 0; color: var(--muted); }
</style>
</head>
<body>
<div id="out"><p class="note">Waiting for the render result.</p></div>
<script>
(function () {
  "use strict";
  // Static page: everything shown comes from the tool result's
  // structuredContent and is put in the page with textContent only. An
  // image source is set only for an https:// link that has not expired.
  var out = document.getElementById("out");
  var PICTURES = { "image/png": true, "image/svg+xml": true };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined && text !== null) { e.textContent = String(text); }
    return e;
  }
  function note(parent, text) { parent.appendChild(el("p", "note", text)); }
  function isHttps(u) { return typeof u === "string" && u.indexOf("https://") === 0; }
  function expired(at) {
    if (typeof at !== "string") { return false; }
    var t = Date.parse(at);
    return !isNaN(t) && t <= Date.now();
  }

  // One entry per picture: render_postscript, handwrite, chalkboard_math and
  // render_result list them in `artifacts`; review_sheet has one, at the top.
  function items(sc) {
    var list = [];
    if (Array.isArray(sc.artifacts)) {
      sc.artifacts.forEach(function (a, i) {
        if (a && typeof a === "object") {
          list.push({ url: a.download_url, expires: a.expires_at,
            mime: a.mime_type || sc.mime_type, page: a.page || i + 1 });
        }
      });
    } else if (typeof sc.mime_type === "string") {
      list.push({ url: sc.download_url, expires: sc.expires_at, mime: sc.mime_type, page: 1 });
    }
    return list;
  }

  function show(it, label, many) {
    var fig = el("figure");
    var prefix = many ? label + ": " : "";
    if (!isHttps(it.url)) {
      note(fig, prefix + "this link is a resource on the MCP server, not a web link, so it " +
        "cannot be shown here.");
    } else if (expired(it.expires)) {
      note(fig, prefix + "this link expired at " + it.expires + "; render again for a new one.");
    } else if (!PICTURES[it.mime]) {
      note(fig, prefix + "a " + (it.mime || "file") + " file, not shown here; open the link.");
    } else {
      var img = el("img");
      img.alt = label;
      img.addEventListener("error", function () {
        img.remove();
        note(fig, prefix + "the picture could not be loaded from its link.");
      });
      img.src = it.url;
      fig.appendChild(img);
    }
    fig.appendChild(el("p", "link", it.url));
    out.appendChild(fig);
  }

  function render(sc) {
    if (!sc || typeof sc !== "object") { return; }
    out.textContent = "";
    if (sc.ok === false) {
      var msg = sc.error && typeof sc.error.message === "string" ? ": " + sc.error.message : ".";
      note(out, "The render failed" + msg);
      return;
    }
    var list = items(sc);
    if (!list.length) {
      note(out, "This result has no pictures.");
      return;
    }
    var linked = list.filter(function (it) { return typeof it.url === "string" && it.url; });
    if (!linked.length) {
      note(out, "The pictures were returned inline, which this view cannot show. Ask for the " +
        "render again with delivery \"url\" to see them here.");
      return;
    }
    linked.forEach(function (it) {
      show(it, list.length > 1 ? "Page " + it.page : "Rendered picture", list.length > 1);
    });
  }

  // ChatGPT: window.openai.toolOutput is the structuredContent.
  function fromOpenAI() {
    try {
      var o = window.openai;
      if (o && o.toolOutput && typeof o.toolOutput === "object") { render(o.toolOutput); }
    } catch (e) { /* not ChatGPT */ }
  }
  fromOpenAI();
  window.addEventListener("openai:set_globals", fromOpenAI);

  // MCP Apps: ui/initialize, then ui/notifications/initialized, then the
  // host sends ui/notifications/tool-result (params: the CallToolResult).
  var initId = 1;
  function send(msg) {
    try {
      if (window.parent && window.parent !== window) { window.parent.postMessage(msg, "*"); }
    } catch (e) { /* no host */ }
  }
  window.addEventListener("message", function (ev) {
    if (ev.source !== window.parent) { return; }
    var m = ev.data;
    if (!m || typeof m !== "object" || m.jsonrpc !== "2.0") { return; }
    if (m.id === initId && m.method === undefined) {
      initId = null;
      if (m.result) { send({ jsonrpc: "2.0", method: "ui/notifications/initialized" }); }
      return;
    }
    if (m.method === "ui/notifications/tool-result") {
      if (m.params && typeof m.params === "object") { render(m.params.structuredContent); }
      return;
    }
    if (typeof m.method === "string" && m.id !== undefined && m.id !== null) {
      send({ jsonrpc: "2.0", id: m.id, result: {} });
    }
  });
  send({ jsonrpc: "2.0", id: initId, method: "ui/initialize", params: {
    protocolVersion: "2026-01-26",
    appInfo: { name: "pscat-render-result", version: "1" },
    clientInfo: { name: "pscat-render-result", version: "1" },
    appCapabilities: {}
  } });
}());
</script>
</body>
</html>
