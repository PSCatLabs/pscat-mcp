name: Container image

# Builds the linux/amd64 image (the Cloud Run target), runs the container
# smoke test against it, and pushes it to GHCR. Only main and v* tags
# publish. Pull requests and runs on other branches (for example the
# workflow_dispatch the "Bump PSCat" workflow starts) build and test only.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pscat-mcp
  PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  image:
    runs-on: ubuntu-latest   # x86_64 runner: a native linux/amd64 build, no QEMU
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: PSCat version from Cargo.lock
        id: pscat
        run: |
          version=$(awk '/^name = "pscat"$/ {found=1; next} found && /^version = / {gsub(/"/, "", $3); print $3; exit}' Cargo.lock)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "PSCat $version"

      - name: Release tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [[ "${GITHUB_REF_NAME}" != "v${crate}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.pscat.outputs.image }}
          # `latest` only from main (rule below), not also from v* tags.
          flavor: |
            latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=pscat-${{ steps.pscat.outputs.version }},enable=${{ env.PUBLISH }}
          labels: |
            org.opencontainers.image.title=pscat-mcp-server
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            io.pscat.renderer.version=${{ steps.pscat.outputs.version }}

      - name: Build (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pscat-mcp:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke test
        run: SKIP_BUILD=1 IMAGE=pscat-mcp:ci scripts/container-smoke.sh

      # The server-layer evals (evals/server/scenarios) against the image
      # that was just smoke-tested. They are an rmcp client test, so this
      # needs a Rust toolchain; the cache keeps the build to the test crate.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Container server evals
        run: SKIP_BUILD=1 IMAGE=pscat-mcp:ci scripts/container-eval.sh
      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-evals-container
          path: target/eval/
          if-no-files-found: ignore

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs and cache as the tested build, so this reuses its layers.
      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Published image (PSCat ${{ steps.pscat.outputs.version }})"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
