name: Bump PSCat

# Moves the PSCat dependency to a newer release tag, runs the tests, pushes a
# bump/pscat-<tag> branch and opens a pull request for it. Runs daily (newest
# PSCat tag, pre-releases included) and on demand. See docs/RELEASING.md.
#
# GitHub holds the checks on a pull request opened by this workflow until a
# maintainer approves the workflows awaiting approval on the PR page. That is the review gate;
# main's branch protection requires those checks before merging.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "PSCat tag, e.g. v0.7.0 (empty: the newest tag)"
        required: false
        default: ""
      release_version:
        description: "Also set this server's version, e.g. 0.2.0 (empty: leave it)"
        required: false
        default: ""

permissions:
  contents: write        # push the bump branch
  pull-requests: write   # open the pull request

concurrency:
  group: bump-pscat
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Bump
        id: bump
        env:
          TAG: ${{ inputs.tag }}
          RELEASE: ${{ inputs.release_version }}
        run: |
          args=("${TAG:---latest}")
          if [[ -n "$RELEASE" ]]; then args+=(--release-version "$RELEASE"); fi
          scripts/bump-pscat.sh "${args[@]}"

      - name: Branch
        id: branch
        if: steps.bump.outputs.changed == 'true'
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
          RELEASE: ${{ inputs.release_version }}
        run: |
          name="bump/pscat-${NEW_TAG}${RELEASE:+-release-$RELEASE}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$name" >/dev/null; then
            echo "::notice::$name already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.bump.outputs.changed == 'true' && steps.branch.outputs.exists == 'false'
        run: cargo test --all --locked

      - name: Push and open a pull request
        if: steps.bump.outputs.changed == 'true' && steps.branch.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OLD_TAG: ${{ steps.bump.outputs.old_tag }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          RELEASE: ${{ inputs.release_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          title="Bump PSCat to $NEW_TAG${RELEASE:+ and release $RELEASE}"
          # -A: the refreshed guide/ can add and remove files.
          git add -A Cargo.toml Cargo.lock guide
          git commit -m "$title"
          git push origin "$BRANCH"

          body=$(cat <<EOF
          PSCat \`$OLD_TAG\` ($OLD_VERSION) → [\`$NEW_TAG\`](https://github.com/PSCatLabs/pscat/releases/tag/$NEW_TAG) ($NEW_VERSION)${RELEASE:+, pscat-mcp-server version → \`$RELEASE\`}.

          Made by the **Bump PSCat** workflow with \`scripts/bump-pscat.sh\`. \`cargo test --all --locked\` passed in that run.

          **To run the required checks, approve the workflows awaiting approval (banner near the merge box).** GitHub holds checks on pull requests opened by a workflow. After merging, follow docs/RELEASING.md to tag the release.
          EOF
          )
          if pr_url=$(gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"); then
            echo "### Opened $pr_url" >> "$GITHUB_STEP_SUMMARY"
            echo "Approve its workflows on the pull request page to run the required checks." >> "$GITHUB_STEP_SUMMARY"
          else
            # Happens when "Allow GitHub Actions to create and approve pull
            # requests" is off (repository or organization setting). A pull
            # request opened by a person from this link runs its checks
            # normally.
            url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "::warning::Could not open the pull request automatically. Open it here: $url"
            echo "### Branch \`$BRANCH\` pushed. [Open the pull request]($url)" >> "$GITHUB_STEP_SUMMARY"
          fi
